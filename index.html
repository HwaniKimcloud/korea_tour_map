<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>대한민국 구석구석 명소 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { 
      width: 370px; 
      min-width: 370px; 
      padding: 16px; 
      background: #f8fafc; 
      border-right: 1px solid #e2e8f0; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      z-index: 1000; 
      box-shadow: 2px 0 8px rgba(0,0,0,0.05); 
    }
    #map { flex: 1; height: 100%; z-index: 1; }
    
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 13px; font-weight: bold; color: #334155; }
    select, button { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; background: white; }
    select:focus { border-color: #2563eb; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; padding: 11px; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    button.export-btn { background: #059669; }
    button.export-btn:hover { background: #047857; }
    
    .content-types-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: white;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .content-types-grid label {
      font-size: 12px;
      font-weight: normal;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    #status-msg { font-size: 12px; color: #64748b; padding: 8px 10px; background: #f1f5f9; border-radius: 6px; line-height: 1.4; word-break: break-all; min-height: 36px; }
    #list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; padding-right: 2px; }
    .place-item { padding: 11px 12px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .place-item:hover { border-color: #2563eb; transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 4px; }
    .badge-tour { background: #dbeafe; color: #1e40af; }
    .badge-food { background: #ffedd5; color: #9a3412; }
    .badge-culture { background: #f3e8ff; color: #6b21a8; }
    .badge-course { background: #dcfce7; color: #166534; }

    .rank-stars { font-size: 11px; color: #f59e0b; font-weight: bold; margin-left: 4px; }
    .place-title { font-weight: bold; font-size: 13px; color: #1e293b; }
    .place-addr { font-size: 11px; color: #64748b; margin-top: 3px; line-height: 1.3; }
    .detail-link { display: inline-block; margin-top: 5px; font-size: 11px; color: #2563eb; text-decoration: none; font-weight: 500; }
    .detail-link:hover { text-decoration: underline; }

    /* 커스텀 마커 아이콘 */
    .custom-div-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px !important;
      height: 32px !important;
      border-radius: 50%;
      color: white;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      border: 2px solid white;
    }
    .icon-tour { background: #2563eb; }    /* 관광지 */
    .icon-food { background: #ea580c; }    /* 맛집 */
    .icon-culture { background: #9333ea; } /* 문화시설 */
    .icon-course { background: #16a34a; }  /* 여행코스 */

    /* 모바일 최적화 미디어 쿼리 */
    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; min-width: 100%; height: 45vh; border-right: none; border-top: 1px solid #cbd5e1; }
      #map { height: 55vh; }
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div class="form-group">
    <label>시·도</label>
    <select id="areaSelect" onchange="onAreaChange()">
      <option value="1" selected>서울특별시</option>

  <div class="form-group">
    <label>별점 필터</label>
    <select id="starFilter" onchange="applyFilters()">
      <option value="1" selected>전체 보기 (★ 1개 이상)</option>
      <option value="5">★★★★★ (5점)</option>

      <option value="3">★★★ 이상</option>
      <option value="2">★★ 이상</option>

  </div>

  <div class="form-group">
    <label>콘텐츠 타입</label>
    <div class="content-types-grid">
      <label><input type="checkbox" name="contentTypes" value="12" data-name="관광지" data-cls="badge-tour" data-icon="icon-tour" data-sym="🏛️" checked> 관광지</label>
      <label><input type="checkbox" name="contentTypes" value="39" data-name="맛집" data-cls="badge-food" data-icon="icon-food" data-sym="🍴" checked> 맛집</label>
      <label><input type="checkbox" name="contentTypes" value="14" data-name="문화시설" data-cls="badge-culture" data-icon="icon-culture" data-sym="🎨"> 문화시설</label>
      <label><input type="checkbox" name="contentTypes" value="25" data-name="여행코스" data-cls="badge-course" data-icon="icon-course" data-sym="🚩"> 여행코스</label>
    </div>
  </div>

  <div style="display:flex; gap:8px;">
    <button id="searchBtn" style="flex:1;" onclick="fetchPlaces()">조회하기</button>
    <button class="export-btn" style="flex:1;" onclick="exportToCSV()">내 지도 CSV 저장</button>
  </div>
  
  <div id="status-msg">준비 완료</div>
  <div id="list-container"></div>
</div>

<div id="map"></div>

<script>
  const API_KEY = "Jqr042WhXmRju%2F2E4uTPkTQqeJWPrWOjV2YRbdOkdF5B6QuZwyE5p1%2BJ1z1vLG6n2ZKpJBVejEavVIIWG8CrKQ%3D%3D";

    ],
    "6": [ // 부산
      { code: "1", name: "강서구" }, { code: "2", name: "금정구" }, { code: "3", name: "기장군" }, { code: "4", name: "남구" },
      { code: "5", name: "동구" }, { code: "6", name: "동래구" }, { code: "7", name: "부산진구" }, { code: "8", name: "북구" },
      { code: "9", name: "사상구" }, { code: "10", name: "사하구" }, { code: "11", name: "서구" }, { code: "12", name: "수영구" },
      { code: "13", name: "연제구" }, { code: "14", name: "영도구" }, { code: "15", name: "중구" }, { code: "16", name: "해운대구" }

      { code: "9", name: "무안군" }, { code: "10", name: "보성군" }, { code: "11", name: "순천시" }, { code: "12", name: "신안군" },
      { code: "13", name: "여수시" }, { code: "14", name: "영광군" }, { code: "15", name: "영암군" }, { code: "16", name: "완도군" },
      { code: "17", name: "장성군" }, { code: "18", name: "장흥군" }, { code: "19", name: "진도군" }, { code: "20", name: "함평군" },
      { code: "21", name: "해남군" }, { code: "22", name: "화순군" }

      { code: "1", name: "가평군" }, { code: "2", name: "고양시" }, { code: "3", name: "과천시" }, { code: "4", name: "광명시" },

      { code: "9", name: "남양주시" }, { code: "10", name: "동두천시" }, { code: "11", name: "부천시" }, { code: "12", name: "성남시" },
      { code: "13", name: "수원시" }, { code: "14", name: "시흥시" }, { code: "15", name: "안산시" }, { code: "16", name: "안성시" },
      { code: "17", name: "안양시" }, { code: "18", name: "양주시" }, { code: "19", name: "양평군" }, { code: "20", name: "여주시" },

    ],
    "36": [ // 경상남도
      { code: "1", name: "거제시" }, { code: "2", name: "거창군" }, { code: "3", name: "고성군" }, { code: "4", name: "김해시" },
      { code: "5", name: "남해군" }, { code: "6", name: "밀양시" }, { code: "7", name: "사천시" }, { code: "8", name: "산청군" },
      { code: "9", name: "양산시" }, { code: "10", name: "의령군" }, { code: "11", name: "진주시" }, { code: "12", name: "창녕군" },
      { code: "13", name: "창원시" }, { code: "14", name: "통영시" }, { code: "15", name: "하동군" }, { code: "16", name: "함안군" },
      { code: "17", name: "함양군" }, { code: "18", name: "합천군" }
    ],
    "39": [ // 제주
      { code: "1", name: "남제주군" }, { code: "2", name: "북제주군" }, { code: "3", name: "서귀포시" }, { code: "4", name: "제주시" }
    ]
  };

  const map = L.map('map').setView([37.5665, 126.9780], 12);
  L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  let currentMarkers = [];
  let rawFetchedData = [];
  let filteredData = [];

  function onAreaChange() {
    const areaCode = document.getElementById('areaSelect').value;
    const sigunguSelect = document.getElementById('sigunguSelect');
    sigunguSelect.innerHTML = '<option value="">전체 (시·도 전체)</option>';

    const list = sigunguDatabase[areaCode] || [];
    list.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.code;
      opt.innerText = item.name;
      sigunguSelect.appendChild(opt);
    });
  }
  onAreaChange();

  // 안전하고 확실한 표준 TourAPI 호출
  async function fetchPlaces() {
    const searchBtn = document.getElementById('searchBtn');
    const statusMsg = document.getElementById('status-msg');
    const areaCode = document.getElementById('areaSelect').value;
    const sigunguCode = document.getElementById('sigunguSelect').value;

    const selectedBoxes = Array.from(document.querySelectorAll('input[name="contentTypes"]:checked'));
    if (selectedBoxes.length === 0) {
      alert('콘텐츠 타입을 최소 하나 이상 선택해주세요.');
      return;
    }

    searchBtn.disabled = true;
    statusMsg.style.color = '#2563eb';
    statusMsg.innerText = '데이터를 불러오는 중입니다...';
    clearMap();
    rawFetchedData = [];

    const allCollected = [];

    try {
      // 선택된 타입별로 안전하게 1회씩만 단일 요청 (트래픽 완벽 보호)
      for (const box of selectedBoxes) {
        statusMsg.innerText = `[${box.dataset.name}] 조회 중...`;
        
        let url = `https://apis.data.go.kr/B551011/KorService2/areaBasedList2?serviceKey=${API_KEY}&numOfRows=50&pageNo=1&MobileOS=ETC&MobileApp=AppTest&_type=json&arrange=B&contentTypeId=${box.value}&areaCode=${areaCode}`;
        
        if (sigunguCode) {
          url += `&sigunguCode=${sigunguCode}`;
        }

        const res = await fetch(url);
        if (!res.ok) continue;

        const data = await res.json();
        const rawItems = data.response?.body?.items?.item || [];
        const list = Array.isArray(rawItems) ? rawItems : (rawItems ? [rawItems] : []);

        list.forEach(item => {
          const lat = parseFloat(item.mapy);
          const lng = parseFloat(item.mapx);
          const title = item.title || '';
          if (isNaN(lat) || isNaN(lng)) return;

          allCollected.push({
            name: title,
            category: box.dataset.name,
            cls: box.dataset.cls,
            iconClass: box.dataset.icon,
            sym: box.dataset.sym,
            lat: lat,
            lng: lng,
            addr: item.addr1 || '',
            tel: item.tel || '',
            url: `https://korean.visitkorea.or.kr/search/search_list.do?keyword=${encodeURIComponent(title)}`
          });
        });
      }

      // 중복 제거
      const seen = new Set();
      rawFetchedData = allCollected.filter(p => {
        const uid = p.name + p.lat + p.lng;
        if (seen.has(uid)) return false;
        seen.add(uid);
        return true;
      });

      // 1~5점 별점 부여
      rawFetchedData.forEach((p, idx) => {
        const ratio = (idx + 1) / rawFetchedData.length;
        if (ratio <= 0.20) p.star = 5;
        else if (ratio <= 0.45) p.star = 4;
        else if (ratio <= 0.70) p.star = 3;
        else if (ratio <= 0.90) p.star = 2;
        else p.star = 1;
      });

      if (rawFetchedData.length === 0) {
        statusMsg.style.color = '#64748b';
        statusMsg.innerText = '조회된 결과가 없습니다. (등록된 장소가 없거나 점검 중)';
      } else {
        statusMsg.style.color = '#059669';
        statusMsg.innerText = `조회 완료! 총 ${rawFetchedData.length}개의 명소를 불러왔습니다.`;
      }

      applyFilters();

    } catch (err) {
      statusMsg.style.color = '#dc2626';
      statusMsg.innerText = `호출 실패: ${err.message}`;
    } finally {
      searchBtn.disabled = false;
    }
  }

  // 별점 필터링
  function applyFilters() {
    const filterVal = parseInt(document.getElementById('starFilter').value, 10);

    if (rawFetchedData.length === 0) {
      clearMap();
      document.getElementById('list-container').innerHTML = '';
      return;
    }

    filteredData = rawFetchedData.filter(p => p.star >= filterVal);
    renderPlaces(filteredData);
  }

  // 렌더링
  function renderPlaces(places) {
    clearMap();
    const list = document.getElementById('list-container');
    list.innerHTML = '';

    if (places.length === 0) {
      list.innerHTML = '<div style="padding:10px; color:#64748b;">조건에 맞는 장소가 없습니다.</div>';
      return;
    }

    const bounds = [];

    places.forEach((p) => {
      const starsStr = '★'.repeat(p.star);
      
      const customIcon = L.divIcon({
        className: 'custom-div-icon-wrapper',
        html: `<div class="custom-div-icon ${p.iconClass}">${p.sym}</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      const marker = L.marker([p.lat, p.lng], { icon: customIcon }).addTo(map)
        .bindPopup(`
          <div style="font-size:13px; line-height:1.4;">
            <b class="badge ${p.cls}">${p.category}</b> <span class="rank-stars">${starsStr}</span><br>
            <b style="font-size:14px;">${p.name}</b><br>
            <div style="color:#64748b; font-size:12px; margin-top:3px;">${p.addr}</div>
            ${p.tel ? `<div style="color:#0284c7; font-size:12px;">📞 ${p.tel}</div>` : ''}
            <div style="margin-top:6px;">
              <a href="${p.url}" target="_blank" class="detail-link">상세 보기 ↗</a>
            </div>
          </div>
        `);
      currentMarkers.push(marker);
      bounds.push([p.lat, p.lng]);

      const div = document.createElement('div');
      div.className = 'place-item';
      div.innerHTML = `
        <span class="badge ${p.cls}">${p.category}</span> <span class="rank-stars">${starsStr}</span>
        <div class="place-title">${p.name}</div>
        <div class="place-addr">${p.addr}</div>
        <a href="${p.url}" target="_blank" class="detail-link" onclick="event.stopPropagation()">상세 보기 ↗</a>
      `;
      div.onclick = () => {
        map.flyTo([p.lat, p.lng], 14, { duration: 0.8 });
        marker.openPopup();
      };
      list.appendChild(div);
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  }

  function clearMap() {
    currentMarkers.forEach(m => map.removeLayer(m));
    currentMarkers = [];
  }

  function exportToCSV() {
    if (filteredData.length === 0) {
      alert('저장할 데이터가 없습니다.');
      return;
    }

    let csvContent = '\uFEFFName,Category,Stars,Latitude,Longitude,Address,Tel,DetailPageURL\n';
    filteredData.forEach(p => {
      const cleanName = `"${(p.name || '').replace(/"/g, '""')}"`;
      const cleanAddr = `"${(p.addr || '').replace(/"/g, '""')}"`;
      csvContent += `${cleanName},${p.category},${p.star},${p.lat},${p.lng},${cleanAddr},${p.tel || ''},${p.url || ''}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `tour_places_${Date.now()}.csv`;
    link.click();
  }
</script>
