    button.export-btn:hover { background: #047857; }
    
    .content-types-grid {
      display: grid;

      gap: 6px;
      background: white;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .content-types-grid label {
      font-size: 12px;
      font-weight: normal;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;

      { code: "870", name: "함양군" }, { code: "880", name: "거창군" }, { code: "890", name: "합천군" }
    ],
    "50": [
      { code: "110", name: "제주시" }, { code: "130", name: "서귀포시" }
    ]
  };

  // 광역 시·도별 [전체] 선택 시 대표 거점 (광주, 전남, 세종 0건 차단용)
  const balancedTargets = {
    "11": ["110", "680", "440", "710"], // 서울: 종로, 강남, 마포, 송파
    "26": ["110", "350", "380", "230"], // 부산: 중구, 해운대, 사하, 부산진
    "29": ["110", "140", "170", "200"], // 광주: 동구, 서구, 북구, 광산구
    "36": [""],                          // 세종: 구 없음(단일 호출)
    "46": ["130", "150", "110", "710"], // 전남: 여수, 순천, 목포, 담양
    "48": ["121", "310", "840", "170"]  // 경남: 창원, 거제, 남해, 진주
  };

  const map = L.map('map').setView([37.5665, 126.9780], 12);
  L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  let currentMarkers = [];
  let rawFetchedData = [];
  let filteredData = [];

  function onRegionChange() {
    const regn = document.getElementById('regnSelect').value;
    const sigunguSelect = document.getElementById('sigunguSelect');
    sigunguSelect.innerHTML = '<option value="">전체</option>';

    const list = fullSigunguDatabase[regn] || [];
    list.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.code;
      opt.innerText = item.name;
      sigunguSelect.appendChild(opt);
    });
  }
  onRegionChange();

  // API 장소 수집
  async function fetchPlaces() {
    const searchBtn = document.getElementById('searchBtn');
    const statusMsg = document.getElementById('status-msg');
    const regnCd = document.getElementById('regnSelect').value;
    const sigunguCd = document.getElementById('sigunguSelect').value;

    const selectedBoxes = Array.from(document.querySelectorAll('input[name="contentTypes"]:checked'));
    if (selectedBoxes.length === 0) {
      alert('콘텐츠 타입을 최소 하나 이상 선택해주세요.');
      return;
    }

    searchBtn.disabled = true;
    statusMsg.style.color = '#2563eb';
    statusMsg.innerText = '데이터를 조회 중입니다...';
    clearMap();
    rawFetchedData = [];

    const allCollected = [];

    try {
      if (sigunguCd) {
        // 단일 시군구 직접 지정
        for (const box of selectedBoxes) {
          const items = await callApiWithSafety(regnCd, sigunguCd, box);
          allCollected.push(...items);
        }
      } else {
        // [전체] 선택 시: 대표 거점들로 균형 있게 분산 조회
        const targets = balancedTargets[regnCd] || (fullSigunguDatabase[regnCd] ? fullSigunguDatabase[regnCd].slice(0, 3).map(d => d.code) : ['']);
        for (const tCode of targets) {
          for (const box of selectedBoxes) {
            const items = await callApiWithSafety(regnCd, tCode, box);
            allCollected.push(...items);
          }
        }
      }

      // 중복 제거
      const seen = new Set();
      rawFetchedData = allCollected.filter(p => {
        const uid = p.name + p.lat + p.lng;
        if (seen.has(uid)) return false;
        seen.add(uid);
        return true;
      });

      // 별점(1~5점) 절대/상대 매핑
      rawFetchedData.forEach((p, idx) => {
        const ratio = (idx + 1) / rawFetchedData.length;
        if (ratio <= 0.20) p.star = 5;
        else if (ratio <= 0.45) p.star = 4;
        else if (ratio <= 0.70) p.star = 3;
        else if (ratio <= 0.90) p.star = 2;
        else p.star = 1;
      });

      if (rawFetchedData.length === 0) {
        statusMsg.style.color = '#64748b';
        statusMsg.innerText = '조회된 결과가 없습니다. (해당 지자체 데이터 점검 중일 수 있습니다)';
      } else {
        statusMsg.style.color = '#059669';
        statusMsg.innerText = `조회 완료! 총 ${rawFetchedData.length}개의 명소를 불러왔습니다.`;
      }

      applyFilters();

    } catch (err) {
      statusMsg.style.color = '#dc2626';
      statusMsg.innerText = `오류 발생: ${err.message}`;
    } finally {
      searchBtn.disabled = false;
    }
  }

  // 광주, 세종, 전남 등 코드 호환성 강화 호출
  async function callApiWithSafety(regnCd, sigunguCd, box) {
    let items = await requestApiCore(regnCd, sigunguCd, box);

    // 세종, 광주, 전남의 경우 결과가 0건일 때 대체 코드 1회 재시도
    if (items.length === 0) {
      const altMap = { "36": "8", "29": "5", "46": "36" };
      if (altMap[regnCd]) {
        items = await requestApiCore(altMap[regnCd], "", box);
      }
    }
    return items;
  }

  async function requestApiCore(regnCd, sigunguCd, box) {
    let url = `https://apis.data.go.kr/B551011/KorService2/areaBasedList2?serviceKey=${API_KEY}&numOfRows=25&pageNo=1&MobileOS=ETC&MobileApp=AppTest&_type=json&arrange=B&contentTypeId=${box.value}&lDongRegnCd=${regnCd}`;

    if (sigunguCd && sigunguCd !== "") {
      url += `&lDongSignguCd=${sigunguCd}`;
    }

    try {
      const res = await fetch(url);
      if (!res.ok) return [];
      const text = await res.text();
      const data = JSON.parse(text);

      const rawItems = data.response?.body?.items?.item || [];
      const list = Array.isArray(rawItems) ? rawItems : (rawItems ? [rawItems] : []);

      return list.map(item => {
        const lat = parseFloat(item.mapy);
        const lng = parseFloat(item.mapx);
        const title = item.title || '';
        return {
          name: title,
          category: box.dataset.name,
          cls: box.dataset.cls,
          iconClass: box.dataset.icon,
          sym: box.dataset.sym,
          lat: lat,
          lng: lng,
          addr: item.addr1 || '',
          tel: item.tel || '',
          url: `https://korean.visitkorea.or.kr/search/search_list.do?keyword=${encodeURIComponent(title)}`
        };
      }).filter(p => !isNaN(p.lat) && !isNaN(p.lng) && p.lat >= 33.0 && p.lat <= 39.0);
    } catch (e) {
      return [];
    }
  }

  // 별점 필터링
  function applyFilters() {
    const filterVal = parseInt(document.getElementById('popularityFilter').value, 10);

    if (rawFetchedData.length === 0) {
      clearMap();
      document.getElementById('list-container').innerHTML = '';
      return;
    }

    filteredData = rawFetchedData.filter(p => p.star >= filterVal);
    renderPlaces(filteredData);
  }

  // 마커 및 리스트 렌더링
  function renderPlaces(places) {
    clearMap();
    const list = document.getElementById('list-container');
    list.innerHTML = '';

    if (places.length === 0) {
      list.innerHTML = '<div style="padding:10px; color:#64748b;">조건에 맞는 장소가 없습니다.</div>';
      return;
    }

    const bounds = [];

    places.forEach((p) => {
      const starsStr = '★'.repeat(p.star);
      
      // 카테고리별 고유 아이콘 및 색상 마커 생성
      const customIcon = L.divIcon({
        className: 'custom-div-icon-wrapper',
        html: `<div class="custom-div-icon ${p.iconClass}">${p.sym}</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      const marker = L.marker([p.lat, p.lng], { icon: customIcon }).addTo(map)
        .bindPopup(`
          <div style="font-size:13px; line-height:1.4;">
            <b class="badge ${p.cls}">${p.category}</b> <span class="rank-stars">${starsStr}</span><br>
            <b style="font-size:14px;">${p.name}</b><br>
            <div style="color:#64748b; font-size:12px; margin-top:3px;">${p.addr}</div>
            ${p.tel ? `<div style="color:#0284c7; font-size:12px;">📞 ${p.tel}</div>` : ''}
            <div style="margin-top:6px;">
              <a href="${p.url}" target="_blank" class="detail-link">상세 보기 ↗</a>
            </div>
          </div>
        `);
      currentMarkers.push(marker);
      bounds.push([p.lat, p.lng]);

      const div = document.createElement('div');
      div.className = 'place-item';
      div.innerHTML = `
        <span class="badge ${p.cls}">${p.category}</span> <span class="rank-stars">${starsStr}</span>
        <div class="place-title">${p.name}</div>
        <div class="place-addr">${p.addr}</div>
        <a href="${p.url}" target="_blank" class="detail-link" onclick="event.stopPropagation()">상세 보기 ↗</a>
      `;
      div.onclick = () => {
        map.flyTo([p.lat, p.lng], 14, { duration: 0.8 });
        marker.openPopup();
      };
      list.appendChild(div);
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  }

  function clearMap() {
    currentMarkers.forEach(m => map.removeLayer(m));
    currentMarkers = [];
  }

  function exportToCSV() {
    if (filteredData.length === 0) {
      alert('저장할 데이터가 없습니다.');
      return;
    }

    let csvContent = '\uFEFFName,Category,Stars,Latitude,Longitude,Address,Tel,DetailPageURL\n';
    filteredData.forEach(p => {
      const cleanName = `"${(p.name || '').replace(/"/g, '""')}"`;
      const cleanAddr = `"${(p.addr || '').replace(/"/g, '""')}"`;
      csvContent += `${cleanName},${p.category},${p.star},${p.lat},${p.lng},${cleanAddr},${p.tel || ''},${p.url || ''}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `tour_places_${Date.now()}.csv`;
    link.click();
  }
</script>
